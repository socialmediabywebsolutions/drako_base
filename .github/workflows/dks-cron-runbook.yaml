name: 🔁 DKS Cron Runbook

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  # cada 5 minutos — auto-publish scheduled posts
    - cron: "0 6 * * *"    # 06:00 UTC diario — social metrics sync

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  socialflow-publish-cron:
    name: 📅 SocialFlow — Auto-publish Scheduled Posts
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 🔗 Llamar endpoint de publicación
        run: |
          STATUS=$(curl -s -o /tmp/publish_response.json -w "%{http_code}" \
            -X GET "https://socialflows.drako.systems/api/cron/social/publish" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $STATUS"
          cat /tmp/publish_response.json
          if [ "$STATUS" != "200" ]; then
            echo "❌ Publish cron failed with status $STATUS"
            exit 1
          fi
          echo "✅ Publish cron completed successfully"

  social-metrics-cron:
    name: 📊 Social Metrics — Instagram Insights Sync
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 🔗 Llamar endpoint de métricas
        run: |
          STATUS=$(curl -s -o /tmp/metrics_response.json -w "%{http_code}" \
            -X GET "https://socialflows.drako.systems/api/cron/social/metrics" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $STATUS"
          cat /tmp/metrics_response.json
          if [ "$STATUS" != "200" ]; then
            echo "❌ Metrics cron failed with status $STATUS"
            exit 1
          fi
          echo "✅ Metrics cron completed successfully"

  alerts-check:
    name: 🧪 Auditor Manual de Salud
    runs-on: ubuntu-latest
    env:
      STATUS_URL: https://socialflows.drako.systems/api/status.json
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Ejecutar Auditor Local
        continue-on-error: true
        run: npx tsx scripts/alerts-check.ts

  purge-old-runs:
    name: 🗑️ Purgar runs antiguos (mantener últimos 10)
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Eliminar runs más allá del top 10
        uses: actions/github-script@v7
        with:
          script: |
            let page = 1;
            let allRuns = [];
            while (true) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'dks-cron-runbook.yaml',
                per_page: 100,
                page,
              });
              allRuns = allRuns.concat(data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
              page++;
            }
            const toDelete = allRuns.slice(10);
            console.log(`Total runs: ${allRuns.length} — eliminando ${toDelete.length}`);
            for (const run of toDelete) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }

  cleanup-drafts:
    name: 🧹 Limpieza de Drafts y Logs
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧼 Ejecutar limpieza
        run: |
          if [ -f scripts/purge-drafts.ts ]; then
            npx tsx scripts/purge-drafts.ts
          else
            echo "No purge script found. Skipping."
          fi
