name: 🔁 DKS Cron Runbook

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  alerts-check:
    name: 🧪 Auditor Manual de Salud
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Ejecutar Auditor Local
        run: npx tsx scripts/alerts-check.ts

  cleanup-drafts:
    name: 🧹 Limpieza de Drafts y Logs
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧼 Ejecutar limpieza
        run: |
          if [ -f scripts/purge-drafts.ts ]; then
            npx tsx scripts/purge-drafts.ts
          else
            echo "No purge script found. Skipping."
          fi
