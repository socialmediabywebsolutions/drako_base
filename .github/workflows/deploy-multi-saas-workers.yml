name: Deploy Multi SaaS Workers

on:
  workflow_dispatch:

concurrency:
  group: deploy-multi-saas-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-multi-saas-workers:
    runs-on: ubuntu-latest
    name: Deploy 8 SaaS Workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler 4.69.0
        run: npm install -g wrangler@4.69.0

      - name: Validate Cloudflare secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "BLOCKED: missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "BLOCKED: missing CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          fi

      - name: Validate Cloudflare account identifier
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true' || {
            echo "BLOCKED: invalid CLOUDFLARE_ACCOUNT_ID/token mapping (Cloudflare API validation failed)."
            exit 1
          }

      - name: Validate worker identifiers from config
        run: |
          set -euo pipefail
          for cfg in \
            workers/analytics/wrangler.workers.toml \
            workers/automations/wrangler.workers.toml \
            workers/invoices/wrangler.workers.toml \
            workers/socialflows/wrangler.workers.toml \
            workers/cryptos/wrangler.workers.toml \
            workers/mentorias/wrangler.workers.toml \
            workers/bases/wrangler.workers.toml \
            workers/drakos/wrangler.workers.toml
          do
            [ -f "$cfg" ] || { echo "BLOCKED: missing config $cfg"; exit 1; }
            NAME="$(awk -F '\"' '/^name[[:space:]]*=/ {print $2; exit}' "$cfg")"
            [ -n "$NAME" ] || { echo "BLOCKED: missing worker name in $cfg"; exit 1; }
            echo "Config OK: $cfg -> $NAME"
          done

      - name: Deploy workers
        run: |
          set -euo pipefail
          wrangler deploy --config workers/analytics/wrangler.workers.toml
          wrangler deploy --config workers/automations/wrangler.workers.toml
          wrangler deploy --config workers/invoices/wrangler.workers.toml
          wrangler deploy --config workers/socialflows/wrangler.workers.toml
          wrangler deploy --config workers/cryptos/wrangler.workers.toml
          wrangler deploy --config workers/mentorias/wrangler.workers.toml
          wrangler deploy --config workers/bases/wrangler.workers.toml
          wrangler deploy --config workers/drakos/wrangler.workers.toml

      - name: Wait for DNS and route propagation
        run: sleep 20

      - name: Run multi-SaaS health and fencing checks
        run: bash scripts/check-workers-multi-saas.sh
