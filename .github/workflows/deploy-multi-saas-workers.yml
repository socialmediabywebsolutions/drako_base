name: Deploy Multi SaaS Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-multi-saas-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-multi-saas-workers:
    runs-on: ubuntu-latest
    name: Deploy 8 SaaS Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy analytics
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/analytics/wrangler.workers.toml

      - name: Deploy automations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/automations/wrangler.workers.toml

      - name: Deploy invoices
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/invoices/wrangler.workers.toml

      - name: Deploy socialflows
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/socialflows/wrangler.workers.toml

      - name: Deploy cryptos
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/cryptos/wrangler.workers.toml

      - name: Deploy mentorias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/mentorias/wrangler.workers.toml

      - name: Deploy bases
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/bases/wrangler.workers.toml

      - name: Deploy drakos
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/drakos/wrangler.workers.toml

      - name: Wait for DNS and route propagation
        run: sleep 20

      - name: Run multi-SaaS health and fencing checks
        run: bash scripts/check-workers-multi-saas.sh
