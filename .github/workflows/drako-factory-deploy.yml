name: Drako Factory Deploy
run-name: "🚀 Socialcors · ${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}"

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "apps/**"
      - "workers/**"
      - "packages/**"
      - "migrations/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "next.config.*"
      - "open-next.config.*"
      - "wrangler*.toml"
      - "wrangler*.jsonc"
      - ".github/workflows/drako-factory-deploy.yml"
      - "!docs/**"
      - "!reports/**"
      - "!**/*.md"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "apps/**"
      - "workers/**"
      - "packages/**"
      - "migrations/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "next.config.*"
      - "open-next.config.*"
      - "wrangler*.toml"
      - "wrangler*.jsonc"
      - ".github/workflows/drako-factory-deploy.yml"
      - "!docs/**"
      - "!reports/**"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drako-factory-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.25.0"

      - name: Setup Node.js (LTS) + pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: pnpm

      - name: Verify pnpm lockfile
        run: |
          set -euo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "BLOCKED: pnpm-lock.yaml is required for --frozen-lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run required gates
        run: |
          set -euo pipefail
          pnpm verify:auth-ssot
          npx vitest run tests/api/auth-cross-redirects.test.ts
          pnpm typecheck
          npx vitest run tests/lib/auth-db-selection-failclosed.test.ts
          npx vitest run tests/lib/auth-origin-resolution.test.ts
          npx vitest run tests/lib/auth-session-cookie-e2e.test.ts

  artifact_matrix_skeleton:
    name: Artifact Matrix Skeleton (${{ matrix.product }})
    runs-on: ubuntu-latest
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        product:
          - drakos
          - bases
          - mentorias
          - socialflows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.25.0"

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"

      - name: Generate artifact matrix skeleton manifest
        env:
          ARTIFACT_MATRIX_PRODUCT: ${{ matrix.product }}
          ARTIFACT_MATRIX_OUTPUT_DIR: build/open-next-artifact-matrix/${{ matrix.product }}
        run: |
          set -euo pipefail
          pnpm build:artifacts:skeleton

  build_and_deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # Run even when skeleton jobs fail as long as gates passed
    if: ${{ always() && needs.gates.result == 'success' && (needs.artifact_matrix_skeleton.result == 'success' || needs.artifact_matrix_skeleton.result == 'failure') }}
    needs:
      - gates
      - artifact_matrix_skeleton
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.25.0"

      - name: Setup Node.js (LTS) + pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: pnpm

      - name: Verify pnpm lockfile
        run: |
          set -euo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "BLOCKED: pnpm-lock.yaml is required for --frozen-lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Solo-Worker config present (no legacy wrangler.toml)
        run: |
          set -euo pipefail
          if [ -f wrangler.toml ]; then
            echo "BLOCKED: legacy wrangler.toml must be removed or renamed to wrangler.toml.legacy" >&2
            exit 1
          fi
          if [ ! -f wrangler.workers.toml ]; then
            echo "BLOCKED: wrangler.workers.toml is required for Solo-Worker architecture" >&2
            exit 1
          fi

      - name: Build OpenNext for Cloudflare (guardrail first, then temp wrangler)
        env:
          CI: "true"
        run: |
          set -euo pipefail
          # Guardrail without legacy file present
          npm run check:no-pages

          # Temporary wrangler.toml for opennext build
          cp wrangler.workers.toml wrangler.toml
          npx opennextjs-cloudflare build 2>&1 | tee open-next-build.log
          node scripts/patch-opennext-mentoria-runtime.mjs

          echo "=== BUILD: listing .open-next ==="
          ls -R .open-next || true

          # Cleanup always
          rm -f wrangler.toml

      - name: Emit global artifact matrix skeleton index
        env:
          ARTIFACT_MATRIX_PRODUCT: all
          ARTIFACT_MATRIX_OUTPUT_DIR: build/open-next-artifact-matrix/global
          ARTIFACT_MATRIX_REQUIRE_GLOBAL_BUILD: "1"
        run: |
          set -euo pipefail
          pnpm build:artifacts:skeleton

      - name: Verify SocialFlow product-scoped preview artifact
        run: |
          set -euo pipefail
          test -f .open-next/socialflows-product-scoped-preview/worker.js
          test -d .open-next/socialflows-product-scoped-preview/assets
          test -d .open-next/socialflows-product-scoped-preview/server-functions
          test -d .open-next/socialflows-product-scoped-preview/.build
          test -f .open-next/socialflows-product-scoped-preview/artifact-manifest.json
          test -f .open-next/socialflows-product-scoped-preview/scope-audit.json
          test -f .open-next/socialflows-product-scoped-preview/filter-report.json
          test -f .open-next/socialflows-product-scoped-preview/runtime-audit.json
          grep -q '"productKey": "socialflows"' .open-next/socialflows-product-scoped-preview/artifact-manifest.json
          grep -q '"artifactMode": "product-scoped-preview"' .open-next/socialflows-product-scoped-preview/artifact-manifest.json
          grep -q '"artifactState": "inactive-preview"' .open-next/socialflows-product-scoped-preview/artifact-manifest.json
          grep -q '"derivedFrom": "socialflows-standalone"' .open-next/socialflows-product-scoped-preview/artifact-manifest.json
          grep -q '"runtimeIntegrity": true' .open-next/socialflows-product-scoped-preview/artifact-manifest.json
          grep -q '"runtimeIntegrity": true' .open-next/socialflows-product-scoped-preview/filter-report.json
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(".open-next/socialflows-product-scoped-preview/artifact-manifest.json", "utf8"));
          const audit = JSON.parse(fs.readFileSync(".open-next/socialflows-product-scoped-preview/scope-audit.json", "utf8"));
          const report = JSON.parse(fs.readFileSync(".open-next/socialflows-product-scoped-preview/filter-report.json", "utf8"));
          const runtimeAudit = JSON.parse(fs.readFileSync(".open-next/socialflows-product-scoped-preview/runtime-audit.json", "utf8"));
          const missing = [];
          for (const field of ["filterVersion", "filterGeneratedAt", "runtimeIntegrity", "removedCount", "remainingCount", "unresolvedDependencyCount", "runtimeAuditVersion", "runtimeRiskScore", "scopedActivationReady", "suspiciousRoutes", "crossProductLeaks", "previousLeakCount", "newLeakCount", "removedLeakPrefixes", "remainingCriticalLeaks"]) {
            if (!(field in manifest)) missing.push(`manifest:${field}`);
          }
          for (const field of ["removedRoutes", "remainingRoutes", "unresolvedDependencies", "filteringWarnings"]) {
            if (!(field in report)) missing.push(`report:${field}`);
          }
          for (const field of ["totalRoutes", "allowedRoutes", "suspiciousRoutes", "crossProductLeaks", "unknownRoutes", "sharedInfraRoutes", "runtimeIntegrity", "unresolvedDependencies", "unresolvedDependencyCount", "runtimeRiskScore", "scopedActivationReady", "previousLeakCount", "newLeakCount", "removedLeakPrefixes", "remainingCriticalLeaks", "leakReduction", "removedSurfaces", "retainedSurfaces", "blockingFindings", "warnings", "severityCounts", "leaksBySeverity", "routeClassifications"]) {
            if (!(field in runtimeAudit)) missing.push(`runtimeAudit:${field}`);
          }
          if (missing.length > 0) {
            console.error(`SOCIALFLOW_PRODUCT_SCOPED_PREVIEW_MISSING ${missing.join(",")}`);
            console.error(`SOCIALFLOW_PRODUCT_SCOPED_RUNTIME_AUDIT_MISSING ${missing.join(",")}`);
            process.exit(1);
          }
          if (manifest.artifactMode !== "product-scoped-preview" || manifest.artifactState !== "inactive-preview" || manifest.derivedFrom !== "socialflows-standalone") {
            console.error("SOCIALFLOW_PRODUCT_SCOPED_PREVIEW_FAKE");
            process.exit(1);
          }
          if (manifest.runtimeIntegrity !== true || report.runtimeIntegrity !== true || manifest.unresolvedDependencyCount !== 0 || report.unresolvedDependencies.length > 0) {
            console.error("SOCIALFLOW_PRODUCT_SCOPED_PREVIEW_INTEGRITY_FAILURE");
            process.exit(1);
          }
          if (manifest.removedCount <= 0 || report.removedRoutes.length !== manifest.removedCount || report.remainingRoutes.length !== manifest.remainingCount) {
            console.error("SOCIALFLOW_PRODUCT_SCOPED_PREVIEW_FAKE");
            process.exit(1);
          }
          if (runtimeAudit.totalRoutes !== report.remainingCount || runtimeAudit.routeClassifications.length !== runtimeAudit.totalRoutes) {
            console.error("SOCIALFLOW_PRODUCT_SCOPED_RUNTIME_AUDIT_MISSING");
            process.exit(1);
          }
          if (runtimeAudit.scopedActivationReady === true && (runtimeAudit.crossProductLeaks > 0 || runtimeAudit.suspiciousRoutes > 0 || runtimeAudit.unknownRoutes > 0 || runtimeAudit.runtimeRiskScore > 0 || runtimeAudit.remainingCriticalLeaks.length > 0)) {
            console.error("SOCIALFLOW_PRODUCT_SCOPED_UNSAFE_ACTIVATION_CLAIM");
            process.exit(1);
          }
          console.log(`SocialFlow product-scoped preview summary: removedCount=${report.removedCount} remainingCount=${report.remainingCount} runtimeIntegrity=${report.runtimeIntegrity} unresolvedDependencies=${report.unresolvedDependencies.length} scopedReady=${audit.scopedReady}`);
          console.log(`SocialFlow product-scoped runtime audit summary: runtimeRiskScore=${runtimeAudit.runtimeRiskScore} suspiciousRoutes=${runtimeAudit.suspiciousRoutes} crossProductLeaks=${runtimeAudit.crossProductLeaks} previousLeakCount=${runtimeAudit.previousLeakCount} newLeakCount=${runtimeAudit.newLeakCount} removedLeakPrefixes=${runtimeAudit.removedLeakPrefixes.length} remainingCriticalLeaks=${runtimeAudit.remainingCriticalLeaks.length} scopedActivationReady=${runtimeAudit.scopedActivationReady}`);
          NODE
          if grep -Eq 'export \{ default \} from|export \* from|../worker.js|.open-next/worker.js' .open-next/socialflows-product-scoped-preview/worker.js; then
            echo "SOCIALFLOW_PRODUCT_SCOPED_PREVIEW_FAKE"
            exit 1
          fi

      - name: Production readiness after generated artifacts
        run: |
          set -euo pipefail
          FIXTURES_DIR=tests/fixtures/production-audits/pass pnpm check:production

      - name: open-next-socialflows-standalone-build
        run: |
          set -euo pipefail
          test -f .open-next/socialflows-standalone/worker.js || (echo "SOCIALFLOW_STANDALONE_ARTIFACT_MISSING"; exit 1)

      - name: Verify SocialFlow standalone active artifact
        run: |
          set -euo pipefail
          test -f .open-next/socialflows-standalone/worker.js
          test -d .open-next/socialflows-standalone/assets
          test -d .open-next/socialflows-standalone/server-functions
          test -d .open-next/socialflows-standalone/.build
          test -f .open-next/socialflows-standalone/artifact-manifest.json
          test -f .open-next/socialflows-standalone/scope-audit.json
          grep -q '"productKey": "socialflows"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"artifactMode": "standalone"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"artifactState": "active"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"standaloneArtifactName": "open-next-socialflows-standalone-build"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"scopeMode": "standalone-runtime-copy"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"foreignRouteCount"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"scopedReady": false' .open-next/socialflows-standalone/artifact-manifest.json
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(".open-next/socialflows-standalone/artifact-manifest.json", "utf8"));
          const audit = JSON.parse(fs.readFileSync(".open-next/socialflows-standalone/scope-audit.json", "utf8"));
          const requiredManifestFields = ["scopeMode", "foreignRouteHits", "foreignRouteCount", "scopeAuditVersion", "scopeAuditGeneratedAt", "scopedReady"];
          const requiredAuditFields = ["product", "runtimeMode", "scopeMode", "serverFunctionsPath", "routeCount", "allowedRouteCount", "containsForeignRoutes", "foreignRouteHits", "foreignRouteCount", "foreignRouteExamples", "scopeAuditVersion", "scopeAuditGeneratedAt", "scopedReady"];
          const missing = [
            ...requiredManifestFields.filter((field) => !(field in manifest)).map((field) => `manifest:${field}`),
            ...requiredAuditFields.filter((field) => !(field in audit)).map((field) => `audit:${field}`),
          ];
          if (missing.length > 0) {
            console.error(`SOCIALFLOW_STANDALONE_SCOPE_AUDIT_MISSING ${missing.join(",")}`);
            process.exit(1);
          }
          console.log(`SocialFlow scope audit summary: scopeMode=${manifest.scopeMode} foreignRouteCount=${manifest.foreignRouteCount} scopedReady=${manifest.scopedReady}`);
          if (manifest.scopeMode === "product-scoped" && (manifest.foreignRouteCount > 0 || audit.foreignRouteCount > 0 || manifest.scopedReady !== true)) {
            console.error("SOCIALFLOW_STANDALONE_FAKE_SCOPED_CLAIM");
            process.exit(1);
          }
          NODE
          grep -q './server-functions/default/handler.mjs' .open-next/socialflows-standalone/worker.js
          if grep -Eq 'export \{ default \} from|export \* from' .open-next/socialflows-standalone/worker.js; then
            echo "SOCIALFLOW_STANDALONE_WRAPPER_REGRESSION"
            exit 1
          fi
          if grep -q '"generatedFrom": ".open-next/worker.js"' .open-next/socialflows-standalone/artifact-manifest.json; then
            echo "SOCIALFLOW_STANDALONE_GENERATED_FROM_GLOBAL"
            exit 1
          fi
          if grep -Ein 'dry-run|stub|dummy|placeholder|success: true|text/html' .open-next/socialflows-standalone/worker.js; then
            echo "SOCIALFLOW_STANDALONE_ARTIFACT_FAKE"
            exit 1
          fi
          grep -q 'main = "../../.open-next/socialflows-standalone/worker.js"' workers/socialflows/wrangler.workers.toml
          grep -q 'directory = "../../.open-next/socialflows-standalone/assets"' workers/socialflows/wrangler.workers.toml
          if grep -q 'main = "../../.open-next/socialflows/worker.js"' workers/socialflows/wrangler.workers.toml; then
            echo "SOCIALFLOW_STANDALONE_NOT_ACTIVATED"
            exit 1
          fi

      - name: Guardrail (real worker only, no dry-run/stub)
        run: |
          set -euo pipefail
          WORKER_FILE=".open-next/worker.js"

          if [ ! -f "$WORKER_FILE" ]; then
            echo "BLOCKED: $WORKER_FILE does not exist."
            exit 1
          fi

          BYTES="$(wc -c < "$WORKER_FILE")"
          if [ "$BYTES" -le 1024 ]; then
            echo "BLOCKED: $WORKER_FILE size must be > 1KB, got ${BYTES} bytes."
            exit 1
          fi

          test -d .open-next/assets || {
            echo "BLOCKED: .open-next/assets is missing."
            exit 1
          }

          test -d .open-next/server-functions || {
            echo "BLOCKED: .open-next/server-functions is missing."
            exit 1
          }

          if grep -Ein "dry-run|stub" "$WORKER_FILE"; then
            echo "BLOCKED: detected forbidden dry-run/stub markers in $WORKER_FILE."
            exit 1
          fi

          echo "Worker guardrail passed (${BYTES} bytes, assets + server-functions present)."

      - name: Diagnostic OpenNext artifact layout
        run: |
          set -euo pipefail
          echo "=== listing root ==="
          ls -la
          echo "=== listing .open-next ==="
          ls -R .open-next || true

      - name: Verify OpenNext build artifacts
        run: |
          set -euo pipefail
          ls -la .open-next
          test -f .open-next/worker.js
          test -d .open-next/assets

      - name: Verify Drakos dedicated artifact
        run: |
          set -euo pipefail
          test -f .open-next/drakos/worker.js
          test -d .open-next/drakos/assets
          grep -q 'export { default } from "../worker.js";' .open-next/drakos/worker.js
          grep -q 'export \* from "../worker.js";' .open-next/drakos/worker.js
          test -f .open-next/drakos/artifact-manifest.json
          grep -q '"productKey": "drakos"' .open-next/drakos/artifact-manifest.json
          grep -q '"artifactMode": "dedicated-wrapper"' .open-next/drakos/artifact-manifest.json
          grep -q '"generatedFrom": ".open-next/worker.js"' .open-next/drakos/artifact-manifest.json
          grep -q 'main = "../../.open-next/drakos/worker.js"' workers/drakos/wrangler.workers.toml
          grep -q 'directory = "../../.open-next/drakos/assets"' workers/drakos/wrangler.workers.toml
          if grep -q 'main = "../../.open-next/worker.js"' workers/drakos/wrangler.workers.toml; then
            echo "DRAKOS_DEDICATED_ARTIFACT_NOT_ACTIVATED"
            exit 1
          fi
          if grep -Ein 'dry-run|stub|dummy|placeholder|success: true|text/html' .open-next/drakos/worker.js; then
            echo "DRAKOS_DEDICATED_ARTIFACT_FAKE"
            exit 1
          fi

      - name: Verify Bases dedicated artifact
        run: |
          set -euo pipefail
          test -f .open-next/bases/worker.js
          test -d .open-next/bases/assets
          grep -q 'export { default } from "../worker.js";' .open-next/bases/worker.js
          grep -q 'export \* from "../worker.js";' .open-next/bases/worker.js
          test -f .open-next/bases/artifact-manifest.json
          grep -q '"productKey": "bases"' .open-next/bases/artifact-manifest.json
          grep -q '"artifactMode": "dedicated-wrapper"' .open-next/bases/artifact-manifest.json
          grep -q '"generatedFrom": ".open-next/worker.js"' .open-next/bases/artifact-manifest.json
          grep -q 'main = "../../.open-next/bases/worker.js"' workers/bases/wrangler.workers.toml
          grep -q 'directory = "../../.open-next/bases/assets"' workers/bases/wrangler.workers.toml
          if grep -q 'main = "../../.open-next/worker.js"' workers/bases/wrangler.workers.toml; then
            echo "BASES_DEDICATED_ARTIFACT_NOT_ACTIVATED"
            exit 1
          fi
          if grep -Ein 'dry-run|stub|dummy|placeholder|success: true|text/html' .open-next/bases/worker.js; then
            echo "BASES_DEDICATED_ARTIFACT_FAKE"
            exit 1
          fi

      - name: Verify SocialFlow standalone runtime active
        run: |
          set -euo pipefail
          test -f .open-next/socialflows-standalone/worker.js
          test -d .open-next/socialflows-standalone/assets
          test -d .open-next/socialflows-standalone/server-functions
          test -d .open-next/socialflows-standalone/.build
          test -f .open-next/socialflows-standalone/artifact-manifest.json
          test -f .open-next/socialflows-standalone/scope-audit.json
          grep -q '"productKey": "socialflows"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"artifactMode": "standalone"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"artifactState": "active"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"standaloneArtifactName": "open-next-socialflows-standalone-build"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"scopeMode": "standalone-runtime-copy"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"foreignRouteCount"' .open-next/socialflows-standalone/artifact-manifest.json
          grep -q '"scopedReady": false' .open-next/socialflows-standalone/artifact-manifest.json
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = JSON.parse(fs.readFileSync(".open-next/socialflows-standalone/artifact-manifest.json", "utf8"));
          const audit = JSON.parse(fs.readFileSync(".open-next/socialflows-standalone/scope-audit.json", "utf8"));
          const requiredManifestFields = ["scopeMode", "foreignRouteHits", "foreignRouteCount", "scopeAuditVersion", "scopeAuditGeneratedAt", "scopedReady"];
          const requiredAuditFields = ["product", "runtimeMode", "scopeMode", "serverFunctionsPath", "routeCount", "allowedRouteCount", "containsForeignRoutes", "foreignRouteHits", "foreignRouteCount", "foreignRouteExamples", "scopeAuditVersion", "scopeAuditGeneratedAt", "scopedReady"];
          const missing = [
            ...requiredManifestFields.filter((field) => !(field in manifest)).map((field) => `manifest:${field}`),
            ...requiredAuditFields.filter((field) => !(field in audit)).map((field) => `audit:${field}`),
          ];
          if (missing.length > 0) {
            console.error(`SOCIALFLOW_STANDALONE_SCOPE_AUDIT_MISSING ${missing.join(",")}`);
            process.exit(1);
          }
          console.log(`SocialFlow scope audit summary: scopeMode=${manifest.scopeMode} foreignRouteCount=${manifest.foreignRouteCount} scopedReady=${manifest.scopedReady}`);
          if (manifest.scopeMode === "product-scoped" && (manifest.foreignRouteCount > 0 || audit.foreignRouteCount > 0 || manifest.scopedReady !== true)) {
            console.error("SOCIALFLOW_STANDALONE_FAKE_SCOPED_CLAIM");
            process.exit(1);
          }
          NODE
          grep -q './server-functions/default/handler.mjs' .open-next/socialflows-standalone/worker.js
          grep -q 'main = "../../.open-next/socialflows-standalone/worker.js"' workers/socialflows/wrangler.workers.toml
          grep -q 'directory = "../../.open-next/socialflows-standalone/assets"' workers/socialflows/wrangler.workers.toml
          if grep -Eq 'export \{ default \} from|export \* from' .open-next/socialflows-standalone/worker.js; then
            echo "SOCIALFLOW_STANDALONE_WRAPPER_REGRESSION"
            exit 1
          fi
          if grep -q '"generatedFrom": ".open-next/worker.js"' .open-next/socialflows-standalone/artifact-manifest.json; then
            echo "SOCIALFLOW_STANDALONE_GENERATED_FROM_GLOBAL"
            exit 1
          fi
          if grep -q 'main = "../../.open-next/socialflows/worker.js"' workers/socialflows/wrangler.workers.toml; then
            echo "SOCIALFLOW_STANDALONE_NOT_ACTIVATED"
            exit 1
          fi
          if grep -q 'directory = "../../.open-next/socialflows/assets"' workers/socialflows/wrangler.workers.toml; then
            echo "SOCIALFLOW_STANDALONE_ASSETS_NOT_ACTIVATED"
            exit 1
          fi
          if grep -q 'main = "../../.open-next/worker.js"' workers/socialflows/wrangler.workers.toml; then
            echo "SOCIALFLOW_STANDALONE_GLOBAL_REGRESSION"
            exit 1
          fi
          if grep -Ein 'dry-run|stub|dummy|placeholder|success: true|text/html' .open-next/socialflows-standalone/worker.js; then
            echo "SOCIALFLOW_STANDALONE_ARTIFACT_FAKE"
            exit 1
          fi

      - name: Patch SocialFlow cron handler (inject scheduled())
        run: |
          set -euo pipefail
          # Must run AFTER both SOCIALFLOW_STANDALONE_WRAPPER_REGRESSION guardrails above
          # (this step's own and "Verify SocialFlow standalone active artifact" earlier) —
          # the patch's output keeps `export * from` (see scripts/patch-socialflow-cron-handler.mjs),
          # which those guardrails reject. Running from repo root, not workers/socialflows/,
          # so `.open-next/socialflows-standalone/worker.js` resolves correctly.
          node scripts/patch-socialflow-cron-handler.mjs
          grep -q '__socialflowCronHandlerPatched' .open-next/socialflows-standalone/worker.js || (echo "SOCIALFLOW_CRON_PATCH_FAILED"; exit 1)

      - name: Verify Mentoria dedicated artifact
        run: |
          set -euo pipefail
          test -f .open-next/mentorias/worker.js
          test -d .open-next/mentorias/assets
          grep -q 'export { default } from "../worker.js";' .open-next/mentorias/worker.js
          grep -q 'export \* from "../worker.js";' .open-next/mentorias/worker.js
          test -f .open-next/mentorias/artifact-manifest.json
          grep -q '"productKey": "mentorias"' .open-next/mentorias/artifact-manifest.json
          grep -q '"generatedFrom": ".open-next/worker.js"' .open-next/mentorias/artifact-manifest.json
          if grep -Ein 'dry-run|stub|dummy|placeholder|success: true|text/html' .open-next/mentorias/worker.js; then
            echo "MENTORIA_DEDICATED_ARTIFACT_FAKE"
            exit 1
          fi

      - name: Verify Cloudflare secrets
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "BLOCKED: missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "BLOCKED: missing CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          fi

      - name: Validate Cloudflare account id format
        run: |
          set -euo pipefail
          if [[ ! "${CLOUDFLARE_ACCOUNT_ID}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "BLOCKED: CLOUDFLARE_ACCOUNT_ID must be a 32-character hex string."
            exit 1
          fi

      - name: Validate Cloudflare token
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true' || {
            echo "BLOCKED: invalid CLOUDFLARE_API_TOKEN (token verify failed)."
            exit 1
          }

      - name: Install Wrangler 4.69.0
        run: npm install -g wrangler@4.69.0

      - name: Apply Mentoria auth schema on dedicated auth D1
        run: |
          set -euo pipefail
          wrangler d1 execute MENTORIAS_AUTHS_DB --remote --config workers/mentorias/wrangler.workers.toml --file migrations/0136_auths_isolations.sql

      - name: Verify Mentoria auth tables exist on dedicated auth D1
        run: |
          set -euo pipefail
          OUTPUT="$(wrangler d1 execute MENTORIAS_AUTHS_DB --remote --config workers/mentorias/wrangler.workers.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('mentorias_users', 'mentorias_credentials', 'mentorias_sessions');")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "mentorias_users" || {
            echo "BLOCKED: mentorias_users missing in dedicated Mentoria auth D1 after auth migrations."
            exit 1
          }
          echo "$OUTPUT" | grep -q "mentorias_credentials" || {
            echo "BLOCKED: mentorias_credentials missing in dedicated Mentoria auth D1 after auth migrations."
            exit 1
          }
          echo "$OUTPUT" | grep -q "mentorias_sessions" || {
            echo "BLOCKED: mentorias_sessions missing in dedicated Mentoria auth D1 after auth migrations."
            exit 1
          }

      - name: Apply Mentoria product session persistence schema on dedicated product D1
        run: |
          set -euo pipefail
          wrangler d1 execute MENTORIA_DB --remote --config workers/mentorias/wrangler.workers.toml --file migrations/0160_mentoria_session_persistence.sql
          wrangler d1 execute MENTORIA_DB --remote --config workers/mentorias/wrangler.workers.toml --file migrations/0219_mentoria_family_auth_tables.sql
          wrangler d1 execute MENTORIA_DB --remote --config workers/mentorias/wrangler.workers.toml --file migrations/0217_mentoria_guardian_student_links.sql
          wrangler d1 execute MENTORIA_DB --remote --config workers/mentorias/wrangler.workers.toml --file migrations/0218_mentoria_family_messages.sql

      - name: Verify mentoria_session_state exists in dedicated product D1
        run: |
          set -euo pipefail
          OUTPUT="$(wrangler d1 execute MENTORIA_DB --remote --config workers/mentorias/wrangler.workers.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name='mentoria_session_state';")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "mentoria_session_state" || {
            echo "BLOCKED: mentoria_session_state missing in dedicated Mentoria product D1 after migrations."
            exit 1
          }

      - name: Apply SocialFlow auth schema on dedicated auth D1
        run: |
          set -euo pipefail
          wrangler d1 execute SOCIALFLOW_AUTHS_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0142_socialflow_auths.sql
          wrangler d1 execute SOCIALFLOW_AUTHS_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0196_socialflow_password_reset_tokens.sql
          wrangler d1 execute SOCIALFLOW_AUTHS_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0198_socialflow_users_account_type.sql

      - name: Verify SocialFlow auth tables exist on dedicated auth D1
        run: |
          set -euo pipefail
          OUTPUT="$(wrangler d1 execute SOCIALFLOW_AUTHS_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('socialflow_users','socialflow_credentials','socialflow_sessions','socialflow_password_reset_tokens');")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "socialflow_users" || {
            echo "BLOCKED: socialflow_users missing in SocialFlow auth D1 after migrations."
            exit 1
          }
          echo "$OUTPUT" | grep -q "socialflow_sessions" || {
            echo "BLOCKED: socialflow_sessions missing in SocialFlow auth D1 after migrations."
            exit 1
          }

      - name: Apply SocialFlow product schema on SOCIAL_DB
        run: |
          set -euo pipefail
          # This list re-runs on every deploy (no migration-tracking table), so it only
          # works for idempotent DDL: CREATE TABLE/INDEX IF NOT EXISTS, or ALTER TABLE ADD
          # COLUMN — the latter is made idempotent below by tolerating the "duplicate
          # column name" error wrangler returns once a column already exists. Any other
          # failure (typo, wrong table) still blocks the deploy. D1_RESET_DO is a known
          # transient Cloudflare D1 error (the Durable Object hosting the DB restarts
          # mid-request — cold start / internal reset) that hits a random migration on
          # any given run, not a real SQL problem — retried up to 3 times per file with a
          # 5s pause before giving up and blocking the deploy for real. Same for the
          # generic "internal error; reference = ..." the D1 import API returns on its own
          # hiccups (run #951, 0215). Not matched by code 7500 alone: D1 also uses 7500 for
          # real SQL errors ("no such column ... [code: 7500]"), which must still block.
          for migration in \
            migrations/0184_socialflow_runtime_social_db.sql \
            migrations/0185_socialflow_profiles.sql \
            migrations/0187_socialflow_seed_metadata.sql \
            migrations/0188_socialflow_export_read_models.sql \
            migrations/0189_socialflow_oauth_connections.sql \
            migrations/0190_socialflow_legacy_read_models.sql \
            migrations/0191_socialflow_intelligence_core.sql \
            migrations/0192_socialflow_social_metrics_snapshots.sql \
            migrations/0193_socialflow_conversation_engine.sql \
            migrations/0197_socialflow_knowledge_documents.sql \
            migrations/0199_socialflow_profiles_persona_fields.sql \
            workers/socialflows/migrations/0213_seasonality_cache.sql \
            workers/socialflows/migrations/0214_ai_video_jobs.sql \
            workers/socialflows/migrations/0215_ai_video_jobs_enriched.sql \
            workers/socialflows/migrations/0216_socialflow_ai_usage_log.sql \
            workers/socialflows/migrations/0217_saas_social_accounts_linkedin_cm_enabled.sql \
            workers/socialflows/migrations/0218_socialflow_intelligence_feed_network.sql \
            workers/socialflows/migrations/0219_socialflow_conversation_settings_active_hours.sql \
            workers/socialflows/migrations/0220_empresa_services.sql \
            workers/socialflows/migrations/0221_empresa_services_zona_tarifa_credencial.sql \
            workers/socialflows/migrations/0222_socialcors_trend_triggers.sql; do
            echo "Applying ${migration}..."

            attempt=1
            max_attempts=3
            while true; do
              if OUTPUT="$(wrangler d1 execute SOCIAL_DB --remote --config workers/socialflows/wrangler.workers.toml \
                --file "${migration}" 2>&1)"; then
                echo "$OUTPUT"
                break
              fi

              echo "$OUTPUT"

              if echo "$OUTPUT" | grep -qi "duplicate column name"; then
                echo "Column(s) in ${migration} already exist — skipping (idempotent ALTER TABLE ADD COLUMN re-run)."
                break
              fi

              if echo "$OUTPUT" | grep -Eqi "D1_RESET_DO|internal error; reference" && [ "$attempt" -lt "$max_attempts" ]; then
                attempt=$((attempt + 1))
                echo "Transient D1 error on ${migration} — retrying (attempt ${attempt}/${max_attempts}) in 5s..."
                sleep 5
                continue
              fi

              echo "BLOCKED: ${migration} failed with an unexpected error."
              exit 1
            done
          done

      - name: Verify SocialFlow product tables exist in SOCIAL_DB
        run: |
          set -euo pipefail
          OUTPUT="$(wrangler d1 execute SOCIAL_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('saas_social_accounts','saas_social_posts','saas_social_metrics','socialflow_conversation_threads','socialflow_knowledge_documents');")"
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "saas_social_accounts" || {
            echo "BLOCKED: saas_social_accounts missing in SOCIAL_DB after migrations."
            exit 1
          }
          echo "$OUTPUT" | grep -q "saas_social_posts" || {
            echo "BLOCKED: saas_social_posts missing in SOCIAL_DB after migrations."
            exit 1
          }
          echo "$OUTPUT" | grep -q "socialflow_conversation_threads" || {
            echo "BLOCKED: socialflow_conversation_threads missing in SOCIAL_DB after migrations."
            exit 1
          }
          echo "$OUTPUT" | grep -q "socialflow_knowledge_documents" || {
            echo "BLOCKED: socialflow_knowledge_documents missing in SOCIAL_DB after migrations."
            exit 1
          }

      - name: Apply global schema additions on DRACO_DB (idempotent)
        run: |
          set -euo pipefail
          # 0137: existía en el repo desde hace meses pero nunca estuvo en este paso —
          # por eso auth_users/tenant_users en producción llevan sin las columnas que
          # el código (campamento-core.ts) ya asume (password_hash, active_tenant_id,
          # user_id, invited_by), y las 6 tablas nuevas de este archivo nunca se
          # crearon. Mezcla ALTER TABLE ADD COLUMN (no re-ejecutable tal cual) con
          # CREATE TABLE/INDEX IF NOT EXISTS (sí) — misma tolerancia a "duplicate
          # column name" que ya usa el bucle de SOCIAL_DB más abajo.
          if ! OUTPUT="$(wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0137_campamento_base_workspace_core.sql 2>&1)"; then
            echo "$OUTPUT"
            echo "$OUTPUT" | grep -qi "duplicate column name" || {
              echo "BLOCKED: 0137_campamento_base_workspace_core.sql failed with an unexpected error."
              exit 1
            }
            echo "Column(s) in 0137 already exist — skipping (idempotent re-run)."
          else
            echo "$OUTPUT"
          fi
          # 0138: mismo bug que 0137 (número consecutivo, casi seguro escrita en la
          # misma sesión) — nunca estuvo en este paso, por eso la Card "Operator
          # Social Automation" del panel daba "D1_ERROR: no such table:
          # drako_automation_registrations". Solo CREATE TABLE/INDEX IF NOT EXISTS,
          # sin ALTER TABLE — no necesita la tolerancia a "duplicate column name" que
          # sí hace falta arriba para 0137, siempre es re-ejecutable sin más.
          wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0138_drako_automation_core.sql
          # 0194: ALTER TABLE ADD COLUMN — skip if columns already exist
          if ! wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --command "SELECT saas_id FROM ai_usage_counters LIMIT 1;" > /dev/null 2>&1; then
            echo "Applying 0194_ai_usage_counters_saas_id.sql (columns not yet present)..."
            wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
              --file migrations/0194_ai_usage_counters_saas_id.sql
          else
            echo "0194 already applied — skipping."
          fi
          # 0195: CREATE TABLE IF NOT EXISTS — always idempotent
          wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0195_sso_tokens.sql
          # 0205: Journal IA de drako.systems — CREATE TABLE/INDEX IF NOT EXISTS, idempotente
          wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0205_drako_journal.sql
          # 0206: Métricas sociales del ecosistema Drako — CREATE TABLE/INDEX IF NOT EXISTS, idempotente
          wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0206_drako_ecosystem_metrics.sql
          # 0207: Oportunidades del Agente de Financiación — CREATE TABLE/INDEX IF NOT EXISTS, idempotente
          wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0207_drako_funding.sql
          # 0208: Ventas del CRM de /operator/socialflow — CREATE TABLE/INDEX IF NOT EXISTS, idempotente
          wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0208_drako_crm_sales.sql
          # 0209: Posts del AutoPublishAgent de @drako.systems — CREATE TABLE/INDEX IF NOT EXISTS, idempotente
          wrangler d1 execute DRACO_DB --remote --config workers/socialflows/wrangler.workers.toml \
            --file migrations/0209_drako_social_posts.sql

      - name: Validate Cloudflare account identifier
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -X GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"success":true' || {
            echo "BLOCKED: invalid CLOUDFLARE_ACCOUNT_ID/token mapping (Cloudflare API validation failed)."
            exit 1
          }

      - name: Guard SocialFlow custom domains before deploy
        run: |
          set -euo pipefail
          TOML="workers/socialflows/wrangler.workers.toml"

          if [ ! -f "$TOML" ]; then
            echo "BLOCKED: $TOML not found."
            exit 1
          fi

          if ! grep -q 'pattern = "socialflows.drako.systems"' "$TOML"; then
            echo "BLOCKED: $TOML missing plural domain route."
            exit 1
          fi

          if ! grep -q 'pattern = "socialflow.drako.systems"' "$TOML"; then
            echo "BLOCKED: $TOML missing canonical domain route."
            exit 1
          fi

          CUSTOM_DOMAIN_COUNT=$(grep -c 'custom_domain = true' "$TOML" || true)
          if [ "$CUSTOM_DOMAIN_COUNT" -lt 2 ]; then
            echo "BLOCKED: $TOML must have at least 2 custom_domain = true entries (found: $CUSTOM_DOMAIN_COUNT)."
            exit 1
          fi

          echo "SocialFlow custom domains guard passed (plural + canonical routes present)."

      - name: Ensure SocialFlow AI generation queue exists
        run: |
          set -euo pipefail
          if wrangler queues create saas-socialflow-ai-generation-queue 2>&1 | tee /tmp/socialflow-ai-queue-create.log; then
            echo "Queue saas-socialflow-ai-generation-queue created."
          elif grep -Eiq 'already exists|11009' /tmp/socialflow-ai-queue-create.log; then
            echo "Queue saas-socialflow-ai-generation-queue already exists - continuing."
          else
            echo "BLOCKED: failed to create saas-socialflow-ai-generation-queue."
            cat /tmp/socialflow-ai-queue-create.log
            exit 1
          fi

      - name: Deploy in strict order (scheduler -> drakos -> mentorias -> bases -> socialflows)
        run: |
          set -euo pipefail
          command -v wrangler >/dev/null
          wrangler --version
          ls -la .open-next
          test -f .open-next/worker.js
          test -d .open-next/assets

          pushd workers/drako-scheduler
          wrangler deploy -c wrangler.workers.toml
          popd

          pushd workers/drakos
          test -f ../../.open-next/drakos/worker.js
          test -d ../../.open-next/drakos/assets
          grep -q 'main = "../../.open-next/drakos/worker.js"' wrangler.workers.toml
          grep -q 'directory = "../../.open-next/drakos/assets"' wrangler.workers.toml
          wrangler deploy -c wrangler.workers.toml
          popd

          pushd workers/mentorias
          test -f ../../.open-next/mentorias/worker.js
          test -d ../../.open-next/mentorias/assets
          wrangler deploy -c wrangler.workers.toml
          popd

          pushd workers/bases
          test -f ../../.open-next/bases/worker.js
          test -d ../../.open-next/bases/assets
          grep -q 'main = "../../.open-next/bases/worker.js"' wrangler.workers.toml
          grep -q 'directory = "../../.open-next/bases/assets"' wrangler.workers.toml
          wrangler deploy -c wrangler.workers.toml
          popd

          pushd workers/socialflows
          test -f ../../.open-next/socialflows-standalone/worker.js
          test -d ../../.open-next/socialflows-standalone/assets
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            log_file="../../wrangler-socialflow-deploy-attempt-${attempt}.log"
            echo "SocialFlow deploy attempt ${attempt}/${max_attempts}"
            if wrangler deploy -c wrangler.workers.toml 2>&1 | tee "$log_file"; then
              echo "SocialFlow deploy succeeded on attempt ${attempt}/${max_attempts}"
              break
            fi

            if grep -Eiq 'assets-upload-session|code:[[:space:]]*10013|unknown error' "$log_file"; then
              transient_error_detected=1
              if [ "$attempt" -lt "$max_attempts" ]; then
                backoff_seconds=$((attempt * 10))
                echo "TRANSIENT_SOCIALFLOW_ASSETS_UPLOAD_SESSION_FAILURE: retrying in ${backoff_seconds}s"
                sleep "$backoff_seconds"
                continue
              fi
              echo "SocialFlow deploy failed after ${max_attempts} attempts due to repeated assets-upload-session/code 10013 failures."
              exit 1
            fi

            echo "SocialFlow deploy failed with non-retryable error on attempt ${attempt}/${max_attempts}."
            exit 1
          done
          popd

          pushd workers/socialflow-ai-worker
          wrangler deploy -c wrangler.workers.toml
          popd

          pushd workers/whatsapp-channel
          wrangler deploy -c wrangler.workers.toml --env production
          popd

  smoke:
    name: Smoke Tests (anti-loop / anti-cross)
    runs-on: ubuntu-latest
    needs: build_and_deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.25.0"

      - name: Setup Node.js (LTS) + pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for route propagation
        run: sleep 20

      - name: Validate redirects and domain isolation
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local label="$1"
            local url="$2"
            local allowed_host="$3"
            local forbidden_csv="$4"

            echo "=== ${label} ==="
            echo "URL: ${url}"

            local headers status location location_host
            headers="$(curl -sS -I --max-redirs 0 "$url")"
            status="$(printf '%s\n' "$headers" | awk 'index(toupper($1),"HTTP/")==1 {code=$2} END {print code}')"
            location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^Location:/ {sub(/\r$/,""); sub(/^Location:[[:space:]]*/,""); print; exit}')"

            echo "status: ${status:-unknown}"
            echo "location: ${location:-<none>}"

            if [ -z "${status:-}" ]; then
              echo "BLOCKED: could not read HTTP status for ${url}"
              exit 1
            fi

            if [[ ! "$status" =~ ^(200|301|302|303|307|308)$ ]]; then
              echo "BLOCKED: unexpected status ${status} for ${url}"
              exit 1
            fi

            if ! curl -sS -L --max-redirs 10 -o /dev/null "$url"; then
              echo "BLOCKED: redirect loop or unreachable redirect chain for ${url}"
              exit 1
            fi

            if [ -n "${location:-}" ]; then
              if [[ "$location" =~ ^https?:// ]]; then
                location_host="$(printf '%s\n' "$location" | sed -E 's#^https?://([^/:]+).*$#\1#')"
                if [ "$location_host" != "$allowed_host" ]; then
                  echo "BLOCKED: ${url} redirected to foreign host ${location_host} (allowed: ${allowed_host})"
                  exit 1
                fi
                IFS=',' read -r -a forbidden_hosts <<< "$forbidden_csv"
                for forbidden in "${forbidden_hosts[@]}"; do
                  if [ "$location_host" = "$forbidden" ]; then
                    echo "BLOCKED: ${url} redirected to forbidden domain ${forbidden}"
                    exit 1
                  fi
                done
              fi
            fi
          }

          check_url "drakos-client" "https://drako.systems/client" "drako.systems" "mentorias.drako.systems,bases.drako.systems"
          check_url "mentorias-client" "https://mentorias.drako.systems/client" "mentorias.drako.systems" "drako.systems,bases.drako.systems"
          check_url "bases-admin" "https://bases.drako.systems/admin" "bases.drako.systems" "drako.systems,mentorias.drako.systems"

          echo "SMOKE_OK"

      - name: Validate SocialFlow canonical domain
        env:
          SOCIALFLOW_CANONICAL_SMOKE_ENABLED: "1"
          SOCIALFLOW_CANONICAL_HOST: "socialflow.drako.systems"
          SOCIALFLOW_COMPAT_HOST: "socialflows.drako.systems"
        run: |
          set -euo pipefail
          pnpm smoke:socialflow:canonical:manual
