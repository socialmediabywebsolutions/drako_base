name: Archived Global Worker Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    name: Archived Global Worker Deploy Notice
    steps:
      - name: Explain canonical artifact matrix deploy
        run: |
          echo "GLOBAL_WORKER_DEPLOY_ARCHIVED: .github/workflows/build-worker.yml is archived and cannot deploy."
          echo "Use .github/workflows/drako-factory-deploy.yml as the only valid artifact matrix deploy lane."
          echo "No deployment was executed."
          echo "No artifacts were uploaded."
          echo "No production resources were touched."
          exit 1
