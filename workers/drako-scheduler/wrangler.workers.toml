name = "drako-scheduler"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
logpush = true

# D1 Database (Shared with Main App)
[[d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

# Durable Object for Rate Limiting
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

# Crons
[triggers]
crons = [
    "*/5 * * * *",  # Job Reaper
    "*/15 * * * *", # Reconciliation
    "0 8 * * *",    # Métricas sociales del ecosistema (POST /api/cron/ecosystem-metrics en saas-drakos-prod)
    "0 8 * * 1",    # Agente de Financiación (POST /api/funding/opportunities en saas-drakos-prod)
    "0 9 * * 1-5",  # Journal IA de drako.systems (POST /api/cron/journal en saas-drakos-prod)
    "0 10 * * 1-5"  # AutoPublishAgent de @drako.systems (POST /api/cron/auto-publish en saas-drakos-prod)
]

# Service binding al worker de drako.systems — el cron del Journal llama a su ruta
# /api/cron/journal, /api/cron/ecosystem-metrics, /api/cron/auto-publish y /api/funding/opportunities por RPC interno en vez de fetch() público.
[[services]]
binding = "DRAKOS"
service = "saas-drakos-prod"

# Vars (Secrets should be set via `wrangler secret put`)
[vars]
STRICT_FAIL_CLOSED = "true"
# APP_ORIGIN = "https://drako.systems" # Optional for CORS if needed

# Cloudflare Queues Consumer (Job System)
[[queues.consumers]]
queue = "drako-provisioning-queue"
max_batch_size = 10 # Control concurrency
max_batch_timeout = 5
