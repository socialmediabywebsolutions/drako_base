name = "autopilot-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
logpush = true

[vars]
APP_URL = "http://localhost:3000"

[[d1_databases]]
binding = "DRACO_DB"
database_name = "draco_db"
database_id = "TODO_D1_ID"

[[queues.consumers]]
queue = "autopilot_queue"
dead_letter_queue = "autopilot_dlq"

[triggers]
crons = ["*/30 * * * *"]
