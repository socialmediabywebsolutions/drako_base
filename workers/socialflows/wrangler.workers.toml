name = "saas-socialflows-prod"
main = "../../.open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "../../.open-next/assets"

[[routes]]
pattern = "socialflows.drako.systems"
custom_domain = true

[[routes]]
pattern = "socialflow.drako.systems"
custom_domain = true

# D1 DATABASES
[[d1_databases]]
binding = "SAASES_DB"
database_name = "saas_socialflows_prod_db"
database_id = "6aa6dbaf-9e35-4715-b154-cda8aee0bd54"

# 🔥 FIX: binding adicional para SocialFlow
[[d1_databases]]
binding = "SOCIAL_DB"
database_name = "saas_socialflows_prod_db"
database_id = "6aa6dbaf-9e35-4715-b154-cda8aee0bd54"

# PROVISION_SOCIALFLOW_AUTHS_DB_REQUIRED:
# Do not deploy SOCIALFLOW_AUTHS_DB with a placeholder or shared identity.
# Until a dedicated auth D1 exists, leave this binding intentionally omitted and
# keep application auth fail-closed.
# Provisioning procedure:
#   1. pnpm exec wrangler d1 create saas_socialflow_auths_prod_db
#   2. pnpm exec wrangler d1 create saas_socialflow_auths_preview_db
#   3. Copy the returned database_id values into the dedicated SocialFlow auth
#      bindings in deployable wrangler configs.
#   4. Re-run pnpm check:production before deploy.

[[kv_namespaces]]
binding = "SAASES_CACHE"
id = "2962b3ef53fe4433a253551c83a2df72"

[[r2_buckets]]
binding = "SAASES_STORAGE"
bucket_name = "saas-socialflows-prod-storage"

[[queues.producers]]
binding = "SAASES_EVENTS"
queue = "saas-socialflows-prod-events"

[vars]
SAASES_SLUG = "socialflows"
SAASES_DOMAIN = "socialflows.drako.systems,socialflow.drako.systems"
AUTHS_SECRETS_NAME = "SOCIALFLOWS_AUTHS_SECRET"
WORKERS_ONLY_MODE = "true"
