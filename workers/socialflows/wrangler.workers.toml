name = "saas-socialflows-prod"
main = "../../.open-next/socialflows-standalone/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
logpush = true

[assets]
directory = "../../.open-next/socialflows-standalone/assets"

[[routes]]
pattern = "socialflows.drako.systems"
custom_domain = true

[[routes]]
pattern = "socialflow.drako.systems"
custom_domain = true

# D1 DATABASES
[[d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

[[d1_databases]]
binding = "SAASES_DB"
database_name = "saas_socialflows_prod_db"
database_id = "6aa6dbaf-9e35-4715-b154-cda8aee0bd54"

# 🔥 FIX: binding adicional para SocialFlow
[[d1_databases]]
binding = "SOCIAL_DB"
database_name = "saas_socialflows_prod_db"
database_id = "6aa6dbaf-9e35-4715-b154-cda8aee0bd54"

[[d1_databases]]
binding = "SOCIALFLOW_AUTHS_DB"
database_name = "saas_socialflow_auths_prod_db"
database_id = "f6f46e6a-487f-400a-a2d1-c6d23e88f9cf"

[[kv_namespaces]]
binding = "SAASES_CACHE"
id = "2962b3ef53fe4433a253551c83a2df72"

[[r2_buckets]]
binding = "SAASES_STORAGE"
bucket_name = "saas-socialflows-prod-storage"

[[r2_buckets]]
binding = "SOCIAL_MEDIA_BUCKET"
bucket_name = "socialflow-media"

[[queues.producers]]
binding = "SAASES_EVENTS"
queue = "saas-socialflows-prod-events"

[[queues.producers]]
binding = "SOCIALFLOW_AI_QUEUE"
queue = "saas-socialflow-ai-generation-queue"

[ai]
binding = "AI"

[triggers]
# */5 * * * * -> scheduled publishing + comment auto-reply
# 0 3 * * *   -> daily StyleLearningAgent run (see scripts/patch-socialflow-cron-handler.mjs)
crons = ["*/5 * * * *", "0 3 * * *"]

[vars]
SAASES_SLUG = "socialflows"
SAASES_DOMAIN = "socialflows.drako.systems,socialflow.drako.systems,socialcors.com"
AUTHS_SECRETS_NAME = "SOCIALFLOWS_AUTHS_SECRET"
WORKERS_ONLY_MODE = "true"
INSTAGRAM_APP_ID = "1534853271675778"
APP_URL = "https://socialflows.drako.systems"
# SOCIALFLOW_STRIPE_PRICE_PRO and SOCIALFLOW_STRIPE_PRICE_CREATOR are NOT stored here.
# Set them as Wrangler secrets so they never appear in source control:
#   npx wrangler secret put SOCIALFLOW_STRIPE_PRICE_PRO -c workers/socialflows/wrangler.workers.toml
#   npx wrangler secret put SOCIALFLOW_STRIPE_PRICE_CREATOR -c workers/socialflows/wrangler.workers.toml
