name = "drako-base-3"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Pages: salida de next-on-pages
pages_build_output_dir = ".vercel/output/static"

# Production DB
[[d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

# Preview environment DB (para previews/branch deploys y para tus comandos con --env preview)
[env.preview]
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[env.preview.d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db_preview"
database_id = "4cfbe4ed-23ae-43a6-b442-367ff2d4ad9c"
