name = "saas-socialcors-landing-prod"
main = "worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding      = "DB"
database_name = "socialcors-landing-db"
database_id  = "DATABASE_ID_PLACEHOLDER"

[[routes]]
pattern = "socialcors.com"
custom_domain = true
