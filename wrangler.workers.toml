BASES_AUTHS_SECRET = "temp_secret_change_me_in_dashboard"
AUTHS_ISOLATIONS_ENABLED = "true"
AUTHS_LEGACY_COMPATS_ENABLED = "true"
ROUTINGS_SUBDOMAINS_ENABLED = "true"
