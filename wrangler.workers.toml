name = "drako-base-3"
main = ".open-next/worker.js" 
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ✅ Static assets directory (OpenNext generated)
[assets]
directory = ".open-next/assets"

# ✅ Workers AI binding (required for AI features)
[ai]
binding = "AI"

# ✅ Production DB
[[d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

# ✅ Provisioning Queue (Producer)
[[queues.producers]]
queue = "drako-billing-queue"
binding = "BILLING_QUEUE"

# ✅ SaaS Factory Queue (Producer)
[[queues.producers]]
queue = "drako-saas-factory-queue"
binding = "SAAS_FACTORY_QUEUE"

# ✅ Provisioning Queue (Phase 3.1 Hardening)
[[queues.producers]]
queue = "drako-provisioning-queue"
binding = "PROVISIONING_QUEUE"

# ✅ Scheduler Service Binding (Phase 3)
[[services]]
binding = "SCHEDULER"
service = "drako-scheduler"

# ✅ Production Environment (Explicit)
[env.production]
name = "drako-base-3"
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[env.production.assets]
directory = ".open-next/assets"

[[env.production.d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

[[env.production.queues.producers]]
queue = "drako-billing-queue"
binding = "BILLING_QUEUE"

[[env.production.queues.producers]]
queue = "drako-saas-factory-queue"
binding = "SAAS_FACTORY_QUEUE"

[[env.production.queues.producers]]
queue = "drako-provisioning-queue"
binding = "PROVISIONING_QUEUE"

[[env.production.services]]
binding = "SCHEDULER"
service = "drako-scheduler"

[env.production.ai]
binding = "AI"

[env.production.vars]
ALERT_WEBHOOK_URL = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
NEXTAUTH_SECRET = "temp_secret_change_me_in_dashboard"
NEXTAUTH_URL = "https://drako-base-3.socialmediabywebsolutions.workers.dev"
AUTHS_LEGACY_REGISTER_ENABLED = "0"
DRAKOS_AUTHS_SECRET = "temp_secret_change_me_in_dashboard"
MENTORIAS_AUTHS_SECRET = "temp_secret_change_me_in_dashboard"
BASES_AUTHS_SECRET = "temp_secret_change_me_in_dashboard"
AUTHS_ISOLATIONS_ENABLED = "true"
AUTHS_LEGACY_COMPATS_ENABLED = "true"
ROUTINGS_SUBDOMAINS_ENABLED = "true"
TELEMETRIES_HOLDING_ENABLED = "true"

# ✅ Preview DB
[env.preview]
name = "drako-base-3-preview"
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[env.preview.d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db"
database_id = "10146888-ca79-41d6-b6c2-bf1025eb651b"

[env.preview.ai]
binding = "AI"

# 🛰️ Alerts Agent Trigger (Cron)
[triggers]
crons = ["*/10 * * * *"]

# 🔐 Environment Variables
[vars]
