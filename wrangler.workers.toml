name = "drako-base-3"
# LEGACY/ARCHIVED: deploy oficial usa exclusivamente workers/*/wrangler.workers.toml via --config en CI/CD.
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = ".open-next/assets"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DRACO_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

[[d1_databases]]
binding = "DRAKOS_AUTHS_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

[[d1_databases]]
binding = "MENTORIAS_AUTHS_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

[[d1_databases]]
binding = "SOCIALFLOW_AUTHS_DB"
database_name = "saas_socialflow_auths_prod_db"
database_id = "00000000-0000-0000-0000-000000000000"

[[d1_databases]]
binding = "BASES_AUTHS_DB"
database_name = "drako_db_prod"
database_id = "5607a76a-97c7-45a9-a948-e545ba27eae7"

[[d1_databases]]
binding = "DB"
database_name = "saas_mentorias_prod_db"
database_id = "67b013a3-dcd8-424b-adf9-558895817841"

[[d1_databases]]
binding = "MENTORIA_DB"
database_name = "saas_mentorias_prod_db"
database_id = "67b013a3-dcd8-424b-adf9-558895817841"

[[d1_databases]]
binding = "SOCIAL_DB"
database_name = "saas_socialflows_prod_db"
database_id = "6aa6dbaf-9e35-4715-b154-cda8aee0bd54"

[[queues.producers]]
queue = "drako-billing-queue"
binding = "BILLING_QUEUE"

[[queues.producers]]
queue = "drako-saas-factory-queue"
binding = "SAAS_FACTORY_QUEUE"

[[queues.producers]]
queue = "drako-provisioning-queue"
binding = "PROVISIONING_QUEUE"

[[services]]
binding = "SCHEDULER"
service = "drako-scheduler"

