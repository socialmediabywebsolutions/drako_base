[env.production.vars]
ALERT_WEBHOOK_URL = "https://hooks.slack.com/services/XXX/YYY/ZZZ"
NEXTAUTH_SECRET = "temp_secret_change_me_in_dashboard"
NEXTAUTH_URL = "https://drako.systems"
AUTHS_LEGACY_REGISTER_ENABLED = "0"
DRAKOS_AUTHS_SECRET = "temp_secret_change_me_in_dashboard"
MENTORIAS_AUTHS_SECRET = "temp_secret_change_me_in_dashboard"
BASES_AUTHS_SECRET = "temp_secret_change_me_in_dashboard"
AUTHS_ISOLATIONS_ENABLED = "true"
AUTHS_LEGACY_COMPATS_ENABLED = "true"
ROUTINGS_SUBDOMAINS_ENABLED = "true"
TELEMETRIES_HOLDING_ENABLED = "true"
AUTHS_REQUIRE_CONTEXT_DB = "true"

